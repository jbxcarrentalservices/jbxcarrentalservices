<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Vehicle | JBX Car Rental Services</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">
<a href="index.html">
<img src="Images/logo.png" alt="JBX Logo">
</a>
</div>

<div class="menu-toggle">
<i class="fa-solid fa-bars"></i>
</div>

<nav>

<a href="index.html">HOME</a>
<a href="index.html#cars">OUR CARS</a>
<a href="index.html#cars">RATES</a>
<a href="index.html#requirements">REQUIREMENTS</a>
<a href="index.html#location">LOCATION</a>
<a href="index.html#faq">FAQ</a>

</nav>

<div></div>

</header>

<section class="booking-hero">

<h1>Book Your Vehicle</h1>

<p>

Reserve your preferred vehicle in just a few minutes.

</p>

</section>

<section class="booking-container">

<div class="booking-form">

<h2>Rental Details</h2>

<label>Vehicle</label>

<select id="vehicle">

<option value="vios">
Toyota Vios XLE AT (5 Seater)
</option>

<option value="xpander">
Mitsubishi Xpander GLX AT (7 Seater)
</option>

</select>

<label>Rental Type</label>

<select id="rentalType">

<option value="regular">
Regular (24 Hours)
</option>

<option value="half">
Half Day (12 Hours)
</option>

</select>

<label>Pickup Date</label>

<input type="date" id="pickupDate">

<label>Return Date</label>

<input type="date" id="returnDate">

<label>Pickup Time</label>

<input type="time" id="pickupTime">

<label>Return Time</label>

<input type="time" id="returnTime">

<label>Destination Province</label>

<select id="province">

<option value="">Select Province</option>

<option>Metro Manila</option>
<option>Batangas</option>
<option>Cavite</option>
<option>Rizal</option>
<option>Pampanga</option>
<option>Bataan</option>
<option>Tarlac</option>
<option>Nueva Ecija</option>
<option>Bulacan</option>
<option>Laguna</option>
<option>Zambales</option>
<option>Aurora</option>

<option>Pangasinan</option>
<option>Nueva Vizcaya</option>
<option>Quirino</option>
<option>La Union</option>
<option>Benguet</option>
<option>Quezon</option>
<option>Camarines Norte</option>

<option>Ilocos Sur</option>
<option>Ifugao</option>
<option>Mountain Province</option>
<option>Isabela</option>
<option>Abra</option>
<option>Kalinga</option>
<option>Camarines Sur</option>

<option>Ilocos Norte</option>
<option>Apayao</option>
<option>Cagayan</option>
<option>Albay</option>
<option>Sorsogon</option>

</select>

<label>Exact Destination</label>

<input
type="text"
id="destination"
placeholder="Hotel, Resort, Airport, Complete Address">

<h2 style="margin-top:50px;">Customer Information</h2>

<label>Full Name</label>

<input
type="text"
id="customerName">

<label>Mobile Number</label>

<input
type="tel"
id="customerPhone">

<label>Email (Optional)</label>

<input
type="email"
id="customerEmail">

<label>Driver's License Number</label>

<input
type="text"
id="licenseNumber">

</div>

<div class="booking-summary">

<h2>Estimated Rental</h2>

<div class="summary-card">

<p>

Vehicle

<span id="sumVehicle">

Toyota Vios XLE AT

</span>

</p>

<p>

Rental Type

<span id="sumRentalType">

Regular

</span>

</p>

<p>

Rental Days

<span id="sumDays">

1

</span>

</p>

<p>

Destination

<span id="sumDestination">

-

</span>

</p>

<p>

Daily Rate

<span id="sumRate">

₱0

</span>

</p>

<hr>

<h3>

Estimated Total

<span id="sumTotal">

₱0

</span>

</h3>

<button
id="bookMessenger"
class="book-messenger">

<i class="fa-brands fa-facebook-messenger"></i>

Book via Messenger

</button>

<p
id="bookingWarning"
class="booking-warning">

</p>

</div>

</div>

</section>

<script src="booking.js"></script>

</body>

</html>
